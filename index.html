<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaman Kocaili</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header id="header">
    <span class="nav-logo">YK</span>
    <button id="lang-toggle">EN</button>
  </header>

  <section id="hero">
    <div class="hero-inner">
      <h1 class="hero-name reveal">
        Yaman<br>Kocaili
      </h1>
      <p class="hero-sub reveal reveal-d1"
         data-tr="Yazılım geliştirici."
         data-en="Software developer.">
        Yazılım geliştirici.
      </p>
    </div>
    <div class="scroll-indicator">
      <div class="scroll-line"></div>
    </div>
  </section>

  <section id="projects">
    <div class="container">
      <p class="label reveal"
         data-tr="Projeler"
         data-en="Projects">
        Projeler
      </p>
      <ul class="project-list" id="project-list">
        <li class="skel"><span></span></li>
        <li class="skel"><span></span></li>
        <li class="skel"><span></span></li>
      </ul>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <p class="label reveal"
         data-tr="Bağlantı"
         data-en="Connect">
        Bağlantı
      </p>
      <div class="contact-links reveal reveal-d1">
        <a href="https://instagram.com/yamankocaili" target="_blank" rel="noopener" class="clink">
          <span>Instagram</span><span class="arr">&#8599;</span>
        </a>
        <a href="https://github.com/IQ10yk992" target="_blank" rel="noopener" class="clink">
          <span>GitHub</span><span class="arr">&#8599;</span>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <span>Yaman Kocaili</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
