<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaman Kocaili</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav>
      <span class="nav-logo">YK</span>
      <button id="lang-toggle" aria-label="Toggle language">EN</button>
    </nav>
  </header>

  <main>

    <section id="hero">
      <div class="hero-content reveal">
        <h1 class="hero-name">Yaman<br>Kocaili</h1>
        <p class="hero-sub" data-tr="Yazılım geliştirici. Açık kaynak meraklısı." data-en="Software developer. Open source enthusiast.">Yazılım geliştirici. Açık kaynak meraklısı.</p>
      </div>
      <div class="scroll-hint">
        <div class="scroll-line"></div>
      </div>
    </section>

    <section id="projects">
      <div class="section-inner">
        <h2 class="section-title reveal" data-tr="Projeler" data-en="Projects">Projeler</h2>
        <ul class="project-list" id="project-list">
          <li class="project-skeleton"><span></span></li>
          <li class="project-skeleton"><span></span></li>
          <li class="project-skeleton"><span></span></li>
        </ul>
      </div>
    </section>

    <section id="contact">
      <div class="section-inner">
        <h2 class="section-title reveal" data-tr="Bağlantı" data-en="Connect">Bağlantı</h2>
        <div class="contact-links reveal reveal-delay-1">
          <a href="https://instagram.com/yamankocaili" target="_blank" rel="noopener" class="contact-link">
            Instagram
          </a>
          <a href="https://github.com/iq10yk992" target="_blank" rel="noopener" class="contact-link">
            GitHub
          </a>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <span class="footer-name">Yaman Kocaili</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
